<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvian Help Center</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:700;color:#2563eb}
.lang{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.hero{background:#2563eb;color:#fff;padding:14px 16px;border-radius:0 0 16px 16px}
.hero h1{font-size:22px;margin-bottom:4px}
.hero p{font-size:14px;opacity:.95}
.container{max-width:900px;margin:auto;padding:16px}
#search{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin-bottom:18px}
.section{font-size:18px;font-weight:700;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{margin-bottom:6px;font-size:18px}
.meta{font-size:12px;color:#6b7280;margin-bottom:10px}
.card p{font-size:14px;line-height:1.6;margin-bottom:12px}
.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:14px}
.empty{text-align:center;color:#6b7280;padding:24px}
footer{margin-top:28px;padding:22px 16px;background:#fff;border-top:1px solid #e5e7eb;text-align:center}
footer a{color:#2563eb;text-decoration:none;margin:0 6px;font-size:14px}
.copy{margin-top:10px;font-size:13px;color:#6b7280}
</style>
</head>
<body>

<header class="topbar">
<div class="logo">Solvian</div>

<select id="lang" class="lang">
<option value="bn">বাংলা</option>
<option value="en">English</option>
<option value="ar">العربية</option>
</select>
</header>

<section class="hero">
<h3 id="title">সহায়তা কেন্দ্র</h3>
<p id="subtitle">সকল গাইড, FAQ ও অফিসিয়াল নিবন্ধ এক জায়গায়</p>
</section>

<div class="container">

<input id="search" type="search" placeholder="আর্টিকেল খুঁজুন...">

<div class="section" id="latest">সর্বশেষ নিবন্ধ</div>

<div id="list"></div>

</div>

<footer>
<div>
<a href="../privacy-policy.html">Privacy Policy</a> ·
<a href="../terms-of-service.html">Terms of Service</a> ·
<a href="../help-center.html">Help Center</a>
</div>

<div class="copy">
© 2026 MRIS LLC. All rights reserved.
</div>
</footer>

<script>
const text={
bn:{
title:"সহায়তা কেন্দ্র",
sub:"সকল গাইড, FAQ ও অফিসিয়াল নিবন্ধ এক জায়গায়",
search:"আর্টিকেল খুঁজুন...",
latest:"সর্বশেষ নিবন্ধ",
read:"পড়ুন",
empty:"কোন আর্টিকেল পাওয়া যায়নি।"
},
en:{
title:"Help Center",
sub:"All guides, FAQs and official articles in one place",
search:"Search articles...",
latest:"Latest Articles",
read:"Read",
empty:"No articles found."
},
ar:{
title:"مركز المساعدة",
sub:"جميع الأدلة والأسئلة الشائعة والمقالات الرسمية في مكان واحد",
search:"ابحث عن المقالات...",
latest:"أحدث المقالات",
read:"اقرأ",
empty:"لم يتم العثور على مقالات."
}
};

let articles=[];

function applyLanguage(lang){
localStorage.setItem("lang",lang);
document.documentElement.lang=lang;

title.textContent=text[lang].title;
subtitle.textContent=text[lang].sub;
search.placeholder=text[lang].search;
latest.textContent=text[lang].latest;

renderArticles();
}

function renderArticles(){
const lang=localStorage.getItem("lang")||"bn";
const q=search.value.toLowerCase();

const filtered=articles.filter(a=>
a.title.toLowerCase().includes(q)||
a.description.toLowerCase().includes(q)||
a.category.toLowerCase().includes(q)
);

list.innerHTML="";

if(filtered.length===0){
list.innerHTML=`<div class="empty">${text[lang].empty}</div>`;
return;
}

filtered.forEach(a=>{
list.innerHTML+=`
<div class="card">
<h3>${a.title}</h3>
<div class="meta">${a.category} • ${a.date}</div>
<p>${a.description}</p>
<a class="btn" href="${a.url}">${text[lang].read}</a>
</div>`;
});
}

fetch("articles.json")
.then(r=>r.json())
.then(data=>{
articles=data;
const saved=localStorage.getItem("lang")||"bn";
lang.value=saved;
applyLanguage(saved);
});

search.addEventListener("input",renderArticles);

lang.addEventListener("change",e=>{
applyLanguage(e.target.value);
});
</script>

</body>
</html>
