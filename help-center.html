<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solvian Help & Support</title>

    <!-- Fast connection -->
    <link rel="preconnect" href="https://mrisllc.github.io" crossorigin>
    <link rel="dns-prefetch" href="https://mrisllc.github.io">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            background: #f8f9fa;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            height: 52px;
            flex-shrink: 0;
        }

        .help-support-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }

        .lang-select-container select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .category-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            background: #fff;
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            height: 56px;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .category-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            padding: 8px 18px;
            background: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .cat-btn:hover {
            background: #e2e6ea;
        }

        .cat-btn.active {
            background: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }

        .content-area {
            height: calc(100vh - 108px);
            position: relative;
            background: #fff;
        }

        .content-area iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.25s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #e9ecef;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="help-support-title" id="topTitle">Help & Support</div>
        <div class="lang-select-container">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="en" selected>English</option>
                <option value="bn">বাংলা</option>
            </select>
        </div>
    </div>

    <!-- Category Buttons -->
    <div class="category-scroll-container">
        <button class="cat-btn active" data-key="terms" data-url="https://mrisllc.github.io/Solvian-Pages/terms-of-service.html">Terms of Service</button>
        <button class="cat-btn" data-key="privacy" data-url="https://mrisllc.github.io/Solvian-Pages/privacy-policy.html">Privacy Policy</button>
        <button class="cat-btn" data-key="faq" data-url="https://mrisllc.github.io/Solvian-Pages/faq.html">FAQ</button>
        <button class="cat-btn" data-key="report" data-url="https://mrisllc.github.io/Solvian-Pages/report-problem.html">Report a Problem</button>
        <button class="cat-btn" data-key="articles" data-url="https://mrisllc.github.io/Solvian-Pages/articles/">Articles</button>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
        </div>
        <iframe id="contentFrame" 
                src="https://mrisllc.github.io/Solvian-Pages/terms-of-service.html"
                title="Solvian Content"></iframe>
    </div>

    <script>
        const translations = {
            en: {
                topTitle: "Help & Support",
                terms: "Terms of Service",
                privacy: "Privacy Policy",
                faq: "FAQ",
                report: "Report a Problem",
                articles: "Articles"
            },
            bn: {
                topTitle: "সহায়তা এবং সহযোগিতা",
                terms: "সেবার শর্তাবলী",
                privacy: "গোপনীয়তা নীতি",
                faq: "সাধারণ জিজ্ঞাসা (FAQ)",
                report: "সমস্যা রিপোর্ট করুন",
                articles: "আর্টিকেলসমূহ"
            }
        };

        const iframe = document.getElementById('contentFrame');
        const loading = document.getElementById('loading');

        // Category click
        document.querySelector('.category-scroll-container').addEventListener('click', function(e) {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;

            // Active button
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Show loading
            loading.classList.remove('hidden');

            // Load new page
            iframe.src = btn.dataset.url;
        });

        // Hide loading when iframe finishes loading
        iframe.addEventListener('load', function() {
            loading.classList.add('hidden');
        });

        // Language change
        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            document.getElementById('topTitle').textContent = translations[lang].topTitle;

            document.querySelectorAll('.cat-btn').forEach(btn => {
                const key = btn.dataset.key;
                if (translations[lang][key]) {
                    btn.textContent = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
